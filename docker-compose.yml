services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      # read-only: used for Docker-host monitors in Kuma
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - abraham
      - caddy
    labels:
      # http:// is explicit: a bare hostname makes Caddy attempt ACME, which
      # cannot succeed for .lan and leaves the route dead.
      - "caddy=http://uptime-kuma.svc.lan"
      - "caddy.reverse_proxy={{upstreams 3001}}"

networks:
  abraham:
    external: true
    name: abraham_abraham-network
  caddy:
    external: true
    name: caddy

volumes:
  # Declared external and named explicitly so the volume is NOT prefixed with the
  # compose project name. Without this, renaming the Portainer stack would create a
  # fresh empty volume and silently lose every monitor and all history.
  uptime-kuma-data:
    external: true
    name: uptime-kuma_uptime-kuma-data
